services:
  # 1. PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: scrappy_recipes_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_db_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-scrappy_recipes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipe_admin} -d ${POSTGRES_DB:-scrappy_recipes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Application Container
  app:
    build: .
    container_name: scrappy_recipes_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-recipe_admin}:${POSTGRES_PASSWORD:-secret_db_password_123}@db:5432/${POSTGRES_DB:-scrappy_recipes}
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-recipe_admin}:${POSTGRES_PASSWORD:-secret_db_password_123}@db:5432/postgres
      - APP_API_KEY=${APP_API_KEY:-local_dev_secret_key_123}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-bedrock}
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
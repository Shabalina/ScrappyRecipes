[pytest]
testpaths = tests
asyncio_mode = auto

# Fail loudly instead of silently passing:
#   --strict-markers  unknown @pytest.mark.* is an error, not a typo that skips
#   -ra               summarise every non-pass outcome at the end
addopts = -ra --strict-markers --strict-config

# tests/live/ holds opt-in scripts that make real, billable API calls.
# They are named check_*.py so pytest never auto-collects them.
norecursedirs = tests/live tests/test_images venv .git

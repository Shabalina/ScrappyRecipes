name: Deploy Scrappy Recipes

on:
  push:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: scrappy-recipes
  TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && format('prod-{0}', github.sha) || format('qa-{0}', github.sha) }}

jobs:
  build-and-plan:
    name: Build Image & Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC Token Payload
        run: |
          # Request raw JWT token from GitHub internal runner
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          echo "=== Decoded JWT Payload ==="
          # Decode the middle payload portion of the JWT (base64)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building $IMAGE_URI..."
          docker build -t "$IMAGE_URI" .
          echo "Pushing $IMAGE_URI to ECR..."
          docker push "$IMAGE_URI"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init & Plan
        working-directory: terraform
        env:
          TF_VAR_app_api_key: ${{ secrets.APP_API_KEY }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
        run: |
          terraform init
          terraform workspace select -or-create ${{ env.TARGET_ENV }}
          terraform plan \
            -var-file=environments/${{ env.TARGET_ENV }}.tfvars \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: terraform/tfplan

  apply:
    name: Terraform Apply
    needs: build-and-plan
    runs-on: ubuntu-latest
    # This environment gate triggers the manual approval pause on Prod
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init
          terraform workspace select -or-create ${{ env.TARGET_ENV }}
          terraform apply -auto-approve tfplan